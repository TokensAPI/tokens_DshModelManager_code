# TokensAPI product layer. It hides the generic provider editor, pins the
# primary TokensAPI text and vision routes, and mounts this package's Host +
# browser halves. The private fallback route is added dynamically to the same
# bundled llm-pi-ai adapter, so it does not depend on a separate provider
# plugin. No credential value is present here: each route resolves its own
# reference from DSH credentials.

- id: ui-settings-models
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      tokensapi:
        displayName: TokensAPI
        apiKeyEnv: TOKENSAPI_API_KEY
        api: openai-completions
        baseURL: https://tokensapi.ai/v1
        defaultContextWindow: 262144
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 262144
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: modlens-tokensapi
    model: deepseek-v4-flash

- insert:
    - id: tokens-model-manager
      name: '@tokens/dsh-model-manager'
      config:
        upstream: tokensapi
        providerId: modlens-tokensapi
        settingsCard: false
        pasteToPath: false
